<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ページ総覧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
:root{
  --bg:#F5F6F4;
  --bg-2:#FFFFFF;
  --bg-3:#EBEEEA;
  --ink:#1A201D;
  --ink-2:#3F4A44;
  --muted:#626E67;
  --line:#D4DAD4;
  --line-2:#BFC7C0;
  --accent:#1A6B58;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEDE5;
  --warn:#8A5A11;
  --warn-soft:#F6E9CF;
  --danger:#9B3B2E;
  --shadow:0 12px 32px rgba(26,32,29,.14);
  --font-body:"BIZ UDPGothic","Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A18;
    --bg-2:#1E2522;
    --bg-3:#28312D;
    --ink:#ECF0EC;
    --ink-2:#C2CBC5;
    --muted:#96A29B;
    --line:#2F3935;
    --line-2:#42504A;
    --accent:#6ECDB0;
    --accent-ink:#0F1A16;
    --accent-soft:#1F332C;
    --warn:#E3B45B;
    --warn-soft:#3A2E14;
    --danger:#E2867A;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A18;
  --bg-2:#1E2522;
  --bg-3:#28312D;
  --ink:#ECF0EC;
  --ink-2:#C2CBC5;
  --muted:#96A29B;
  --line:#2F3935;
  --line-2:#42504A;
  --accent:#6ECDB0;
  --accent-ink:#0F1A16;
  --accent-soft:#1F332C;
  --warn:#E3B45B;
  --warn-soft:#3A2E14;
  --danger:#E2867A;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.7;
  padding-inline:clamp(16px,4vw,40px);
  padding-block:0 100px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}

/* header */
.head{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;
  padding-block:32px 20px;
  border-bottom:2px solid var(--ink);
}
.head h1{
  font-weight:700;
  font-size:clamp(26px,4vw,34px);
  letter-spacing:.02em;
  line-height:1.25;
  margin:0;
  text-wrap:balance;
}
.head .eyebrow{
  display:block;
  font-size:13px;letter-spacing:.06em;
  color:var(--muted);margin-bottom:6px;font-weight:700;
}
.stats{
  display:flex;gap:14px 28px;flex-wrap:wrap;min-width:0;
  font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.stats b{display:block;font-family:var(--font-mono);font-size:24px;font-weight:500;color:var(--ink);line-height:1.15}
.stats span{display:block}

/* toolbar */
.tools{
  position:sticky;top:0;z-index:5;
  background:var(--bg);
  padding-block:14px 0;
  border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
}
.search{
  flex:1 1 160px;min-width:0;
  display:flex;align-items:center;gap:8px;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;
  padding:0 12px;height:42px;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;height:100%;outline:none;font-size:16px}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--bg-2)}
.seg button{
  border:0;background:transparent;padding:0 14px;height:40px;cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:700;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{
  border:1px solid var(--line-2);background:var(--bg-2);border-radius:8px;
  height:42px;padding:0 16px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

/* kind tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:4px;padding-bottom:10px}
.tab{
  border:1px solid transparent;border-radius:8px;background:transparent;
  padding:7px 12px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:8px;line-height:1.3;
}
.tab em{font-style:normal;font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tab:hover{background:var(--bg-3);color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab[aria-pressed="true"] em{color:var(--bg);opacity:.8}

.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-bottom:14px;margin-top:-4px}
.chip{
  border:1px solid var(--line-2);background:var(--bg-2);border-radius:999px;
  padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;line-height:1.4;
}
.chip em{font-style:normal;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"] em{color:var(--accent);opacity:.85}

/* groups, sections & rows */
.group{padding-top:36px}
.group-h{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:10px;border-bottom:2px solid var(--ink);
}
.group-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em}
.group-h .count{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.group-h .hint{font-size:13.5px;color:var(--muted);margin-left:auto}
.section{padding-block:22px 4px}
.section-h{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:6px;border-bottom:1px solid var(--line-2);
}
.section-h h3{margin:0;font-size:17px;font-weight:700}
.section-h .count{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.section-h .hint{font-size:13.5px;color:var(--muted);margin-left:auto}
.rows{list-style:none;margin:0;padding:0}
.row{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) auto;
  grid-template-areas:"ico main meta";
  gap:4px 14px;align-items:center;
  padding:13px 6px;border-bottom:1px solid var(--line);
  position:relative;border-radius:6px;
}
.row:hover{background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--line)}
.row .ico{grid-area:ico;font-size:24px;line-height:1;text-align:center}
.row .ico.mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:9px;margin:0 auto;
  background:var(--bg-3);color:var(--ink-2);
  font-family:var(--font-mono);font-size:13px;font-weight:500;letter-spacing:.02em;
}
.row .ico.mark[data-kind="vercel"]{background:var(--ink);color:var(--bg);font-size:12px}
.row .main{grid-area:main;min-width:0}
.row .title{
  display:block;font-weight:700;text-decoration:none;font-size:16px;line-height:1.5;
  overflow-wrap:anywhere;
}
.row .title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.row .title::after{content:"";position:absolute;inset:0}
.row .note{display:block;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.55;overflow-wrap:anywhere}
.row .meta{grid-area:meta;display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .tag{font-family:var(--font-body);font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--bg-3);border-radius:6px;padding:3px 8px;line-height:1.3}
.row .tag.pub{color:var(--accent);background:var(--accent-soft)}
.row .tag.err{color:var(--warn);background:var(--warn-soft)}
.row .sub{
  position:relative;z-index:1;
  font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:none;
  border:1px solid var(--line-2);border-radius:6px;padding:4px 10px;background:var(--bg-2);line-height:1.3;
}
.row .sub:hover{color:var(--accent);border-color:var(--accent)}
.row .go{color:var(--muted);display:inline-flex}
.row .edit-actions{display:none;gap:4px;position:relative;z-index:1}
.row .edit-actions button{
  border:1px solid var(--line-2);background:var(--bg-2);border-radius:6px;cursor:pointer;
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);
}
.row .edit-actions button:hover{color:var(--ink);border-color:var(--ink-2)}
.row .edit-actions button.del:hover{color:var(--danger);border-color:var(--danger)}
body[data-editing="1"] .row .edit-actions{display:inline-flex}
body[data-editing="1"] .row .go{display:none}
body[data-editing="1"] .row .title::after{content:none}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* editor panel */
.panel{
  margin-top:20px;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;
  padding:20px 22px;
}
.panel h3{margin:0 0 14px;font-size:15px;color:var(--ink-2);font-weight:700}
.form{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--ink-2);font-weight:700}
.field input,.field select{
  height:42px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:0 12px;font-size:16px;
}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f-kind{grid-column:span 3}.f-title{grid-column:span 7}.f-emoji{grid-column:span 2}
.f-url{grid-column:span 7}.f-cat{grid-column:span 5}.f-live{grid-column:span 5}
.f-note{grid-column:span 12}
.form-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form-actions .err{color:var(--danger);font-size:14px;font-weight:700}
.form-actions .help{color:var(--muted);font-size:13.5px}
@media (max-width:640px){
  body{font-size:15px}
  .f-kind,.f-title,.f-emoji,.f-cat,.f-url,.f-live,.f-note{grid-column:1/-1}
  .f-kind{grid-column:span 8}.f-emoji{grid-column:span 4}
  .row{grid-template-columns:36px minmax(0,1fr);grid-template-areas:"ico main" "ico meta";gap:6px 12px;align-items:start}
  .row .ico{padding-top:4px}
  .row .meta{justify-content:flex-start;flex-wrap:wrap;white-space:normal;row-gap:6px}
  .group-h .hint,.section-h .hint{margin-left:0;width:100%}
  .tab{font-size:14px;padding:6px 10px}
}

/* save bar */
.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;justify-content:center;padding:12px 16px;
  pointer-events:none;
}
.savebar .inner{
  pointer-events:auto;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--ink);color:var(--bg);
  border-radius:12px;padding:10px 14px 10px 18px;box-shadow:var(--shadow);
  max-width:100%;font-size:15px;
}
.savebar .inner .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.savebar .btn{height:38px}
.savebar .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.savebar .btn.ghost{color:var(--bg);opacity:.85}
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:30;
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink);
  padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:14.5px;max-width:calc(100% - 32px);
}
.toast.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.readonly{font-size:13.5px;color:var(--muted)}
.foot{margin-top:44px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:8px 20px;line-height:1.6}
@media (prefers-reduced-motion:no-preference){
  .row{transition:background .12s ease}
  .chip,.btn,.tab{transition:background .12s ease,border-color .12s ease,color .12s ease}
}
</style>
</head>

<script id="app">

  // Kinds of things the hub lists. Order here is the order on the page.
  var KINDS = [
    { key: 'page',     label: 'Webページ', section: 'Webページ',        emoji: '📄', mark: '', hint: 'Claude Code で作ったページ。分類ごとに並びます', dateLabel: '更新' },

    { key: 'supabase', label: 'Supabase', section: 'Supabase',         emoji: '', mark: 'DB',    hint: 'データベース。管理画面へ',                        dateLabel: '作成' },

    { key: 'link',     label: 'その他',   section: 'その他のリンク',    emoji: '🔗', mark: '', hint: '手入力で足したリンク（Render、Notion、スプレッドシートなど）', dateLabel: '追加' }
  ];

  var dataEl = document.getElementById('pages-data');
  var state = JSON.parse(dataEl.textContent);
  var savedJSON = JSON.stringify(state);

  var root = document.getElementById('root');

  var editing = false;
  var editingId = null;
  var artifactCap = null;    // resolved capability namespace, or null
  var readOnly = false;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function kindKey(p) { return p.kind || 'page'; }
  function kindOf(key) {
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i].key === key) return KINDS[i];
    return KINDS[KINDS.length - 1];
  }
  function catOf(key) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].key === key) return state.categories[i];
    }
    return { key: key, label: key, hint: '' };
  }
  function today() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function byUpdatedDesc(a, b) {
    return (b.updated || '').localeCompare(a.updated || '') || a.title.localeCompare(b.title, 'ja');
  }
  function latestUpdate(pages) {
    var t = '';
    pages.forEach(function (p) { if ((p.updated || '') > t) t = p.updated; });
    return t || '—';
  }
  function matches(p, q) {
    if (!q) return true;
    var k = kindOf(kindKey(p));
    var hay = [p.title, p.note, k.label, k.section, p.url, p.live, p.repo,
      kindKey(p) === 'page' ? catOf(p.cat).label : '',
      p.visibility === 'public' ? '公開 public' : (p.visibility === 'private' ? '非公開 private' : '')
    ].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (w) { return !w || hay.indexOf(w) >= 0; });
  }
  function countBy(items, fn) {
    var m = {};
    items.forEach(function (p) { var k = fn(p); m[k] = (m[k] || 0) + 1; });
    return m;
  }
  function dirty() { return JSON.stringify(state) !== savedJSON; }
  function pendingCount() {
    var a = JSON.parse(savedJSON).pages, b = state.pages, n = 0;
    var am = {}, bm = {};
    a.forEach(function (p) { am[p.id] = JSON.stringify(p); });
    b.forEach(function (p) { bm[p.id] = JSON.stringify(p); });
    Object.keys(am).forEach(function (k) { if (bm[k] !== am[k]) n++; });
    Object.keys(bm).forEach(function (k) { if (!(k in am)) n++; });
    return n;
  }

  function iconHTML(p) {

    if (p.emoji) return '<span class="ico" aria-hidden="true">' + esc(p.emoji) + '</span>';

  }

  function rowHTML(p, opts) {
    opts = opts || {};
    var kk = kindKey(p), k = kindOf(kk);
    var href = (kk === 'vercel' && p.live) ? p.live : p.url;
    var note = p.note || '';
    if (kk === 'vercel' && p.repo) note += (note ? ' ・ ' : '') + 'GitHub: ' + p.repo;
    if (kk === 'vercel' && p.live) note += (note ? ' ・ ' : '') + p.live.replace(/^https?:\/\//, '');

    var tags = '';
    if (opts.showKind) tags += '<span class="tag">' + esc(k.label) + '</span>';
    if (opts.showCat && kk === 'page') tags += '<span class="tag">' + esc(catOf(p.cat).label) + '</span>';
    if (kk === 'repo' && p.visibility === 'public') tags += '<span class="tag pub">公開</span>';
    if (kk === 'repo' && p.visibility === 'private') tags += '<span class="tag">非公開</span>';
    if (kk === 'vercel' && p.status === 'error') tags += '<span class="tag err">デプロイ失敗</span>';
    if (p.status === 'private') tags += '<span class="tag">非公開</span>';

    var sub = '';
    if (kk === 'vercel' && p.live && p.url) {
      sub = '<a class="sub" href="' + esc(p.url) + '" target="_blank" rel="noopener">管理画面</a>';
    }

    return '<li class="row" data-id="' + esc(p.id) + '">' +
      iconHTML(p) +
      '<span class="main">' +
        '<a class="title" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a>' +
        (note ? '<span class="note">' + esc(note) + '</span>' : '') +
      '</span>' +
      '<span class="meta">' +
        tags + sub +
        '<span class="date">' + esc(p.updated || '') + '</span>' +
        '<span class="go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 12 4M6 4h6v6"/></svg></span>' +
        '<span class="edit-actions">' +
          '<button type="button" class="ed" data-act="edit" data-id="' + esc(p.id) + '" title="編集" aria-label="編集"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5l2 2L5 13H3v-2z"/></svg></button>' +
          '<button type="button" class="del" data-act="del" data-id="' + esc(p.id) + '" title="削除" aria-label="削除"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>' +
        '</span>' +
      '</span>' +
    '</li>';
  }

  function groupHeadHTML(k, n) {
    return '<div class="group-h"><h2>' + esc(k.section) + '</h2><span class="count">' + n + '</span>' +
      (k.hint ? '<span class="hint">' + esc(k.hint) + '</span>' : '') + '</div>';
  }

  function listHTML(st, f) {
    var kindFilter = f.cat !== 'all' ? 'page' : f.kind;
    var items = st.pages.filter(function (p) {
      if (!matches(p, f.q)) return false;
      if (kindFilter !== 'all' && kindKey(p) !== kindFilter) return false;
      if (f.cat !== 'all' && p.cat !== f.cat) return false;
      return true;
    });
    if (!items.length) {
      return '<p class="empty">該当するものがありません。</p>';
    }
    if (f.view === 'flat') {
      return '<section class="group"><div class="group-h"><h2>更新が新しい順</h2><span class="count">' + items.length + '</span>' +
        '<span class="hint">種類をまたいで日付順に並べています</span></div>' +
        '<ul class="rows">' + items.slice().sort(byUpdatedDesc).map(function (p) { return rowHTML(p, { showKind: true, showCat: true }); }).join('') + '</ul></section>';
    }
    var out = '';
    KINDS.forEach(function (k) {
      var rows = items.filter(function (p) { return kindKey(p) === k.key; });
      if (!rows.length) return;
      out += '<section class="group" id="kind-' + esc(k.key) + '">' + groupHeadHTML(k, rows.length);
      if (k.key === 'page') {
        st.categories.forEach(function (c) {
          var cr = rows.filter(function (p) { return p.cat === c.key; }).sort(byUpdatedDesc);
          if (!cr.length) return;
          out += '<section class="section" id="cat-' + esc(c.key) + '">' +
            '<div class="section-h"><h3>' + esc(c.label) + '</h3><span class="count">' + cr.length + '</span>' +
            (c.hint ? '<span class="hint">' + esc(c.hint) + '</span>' : '') + '</div>' +
            '<ul class="rows">' + cr.map(function (p) { return rowHTML(p); }).join('') + '</ul></section>';
        });
        var orphans = rows.filter(function (p) { return !st.categories.some(function (c) { return c.key === p.cat; }); });
        if (orphans.length) {
          out += '<section class="section"><div class="section-h"><h3>未分類</h3><span class="count">' + orphans.length + '</span></div>' +
            '<ul class="rows">' + orphans.sort(byUpdatedDesc).map(function (p) { return rowHTML(p); }).join('') + '</ul></section>';
        }
      } else {
        out += '<ul class="rows">' + rows.sort(byUpdatedDesc).map(function (p) { return rowHTML(p); }).join('') + '</ul>';
      }
      out += '</section>';
    });
    return out;
  }

  function tabsHTML(st, f) {
    var counts = countBy(st.pages, kindKey);
    var h = '<button type="button" class="tab" data-kind="all" aria-pressed="' + (f.kind === 'all') + '">すべて <em>' + st.pages.length + '</em></button>';
    KINDS.forEach(function (k) {
      var n = counts[k.key] || 0;
      if (!n && k.key !== 'link') return;
      h += '<button type="button" class="tab" data-kind="' + esc(k.key) + '" aria-pressed="' + (f.kind === k.key) + '">' + esc(k.label) + ' <em>' + n + '</em></button>';
    });
    return h;
  }

  function chipsHTML(st, f) {
    var pages = st.pages.filter(function (p) { return kindKey(p) === 'page'; });
    var counts = countBy(pages, function (p) { return p.cat; });
    var h = '<button type="button" class="chip" data-cat="all" aria-pressed="' + (f.cat === 'all') + '">すべての分類 <em>' + pages.length + '</em></button>';
    st.categories.forEach(function (c) {
      h += '<button type="button" class="chip" data-cat="' + esc(c.key) + '" aria-pressed="' + (f.cat === c.key) + '">' + esc(c.label) + ' <em>' + (counts[c.key] || 0) + '</em></button>';
    });
    return h;
  }

  function catOptionsHTML(st, sel) {
    return st.categories.map(function (c) {
      return '<option value="' + esc(c.key) + '"' + (c.key === sel ? ' selected' : '') + '>' + esc(c.label) + '</option>';
    }).join('');
  }
  function kindOptionsHTML(sel) {
    return KINDS.map(function (k) {
      return '<option value="' + esc(k.key) + '"' + (k.key === sel ? ' selected' : '') + '>' + esc(k.label) + '</option>';
    }).join('');
  }

  function bodyHTML(st, f) {
    f = f || ui;
    var counts = countBy(st.pages, kindKey);
    var deploy = (counts.vercel || 0) + (counts.supabase || 0) + (counts.xserver || 0);
    return '' +
      '<header class="head">' +
        '<div><span class="eyebrow">全部の入口</span><h1>' + esc(TITLE) + '</h1></div>' +
        '<div class="stats">' +
          '<div><b>' + (counts.page || 0) + '</b><span>Webページ</span></div>' +
          '<div><b>' + (counts.repo || 0) + '</b><span>リポジトリ</span></div>' +
          '<div><b>' + deploy + '</b><span>サイト・DB</span></div>' +
          (counts.link ? '<div><b>' + counts.link + '</b><span>その他</span></div>' : '') +
          '<div><b>' + esc(latestUpdate(st.pages)) + '</b><span>最終更新</span></div>' +
        '</div>' +
      '</header>' +
      '<div class="tools" id="tools">' +
        '<label class="search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>' +
          '<input id="q" type="search" placeholder="名前・メモ・URLで探す" value="' + esc(f.q) + '" autocomplete="off"></label>' +
        '<div class="seg" role="group" aria-label="並び">' +
          '<button type="button" data-view="grouped" aria-pressed="' + (f.view === 'grouped') + '">種類ごと</button>' +
          '<button type="button" data-view="flat" aria-pressed="' + (f.view === 'flat') + '">更新順</button>' +
        '</div>' +
        '<button type="button" class="btn" id="edit-toggle" hidden>追加・編集</button>' +
        '<span class="readonly" id="readonly-note" hidden>閲覧専用</span>' +
        '<div class="tabs" id="tabs" role="group" aria-label="種類">' + tabsHTML(st, f) + '</div>' +
        '<div class="chips" id="chips"' + ((f.kind === 'all' || f.kind === 'page') ? '' : ' hidden') + '>' + chipsHTML(st, f) + '</div>' +
      '</div>' +
      '<div class="panel" id="panel" hidden>' +
        '<h3 id="panel-title">追加する</h3>' +
        '<form class="form" id="form" autocomplete="off">' +
          '<div class="field f-kind"><label for="f-kind">種類</label><select id="f-kind">' + kindOptionsHTML('page') + '</select></div>' +
          '<div class="field f-title"><label for="f-title">名前</label><input id="f-title" required placeholder="例：来月のキャンペーン設計"></div>' +
          '<div class="field f-emoji"><label for="f-emoji">絵文字</label><input id="f-emoji" placeholder="空なら種類の印" maxlength="4"></div>' +
          '<div class="field f-url"><label for="f-url" id="f-url-label">URL</label><input id="f-url" type="url" required placeholder="https://"></div>' +
          '<div class="field f-cat" id="f-cat-wrap"><label for="f-cat">分類</label><select id="f-cat">' + catOptionsHTML(st, st.categories[0] && st.categories[0].key) + '</select></div>' +
          '<div class="field f-live" id="f-live-wrap" hidden><label for="f-live">本番URL（任意）</label><input id="f-live" type="url" placeholder="https://xxx.vercel.app"></div>' +
          '<div class="field f-note"><label for="f-note">ひとことメモ</label><input id="f-note" placeholder="何のものか一行で"></div>' +
          '<div class="form-actions">' +
            '<button type="submit" class="btn primary" id="form-submit">一覧に追加</button>' +
            '<button type="button" class="btn ghost" id="form-cancel">やめる</button>' +
            '<span class="err" id="form-err"></span>' +
            '<span class="help">Render や Notion、スプレッドシートなどは「その他」で登録できます</span>' +
          '</div>' +
        '</form>' +
      '</div>' +
      '<main id="list">' + listHTML(st, f) + '</main>' +
      '<footer class="foot"><span>「追加・編集」から登録・修正すると、この一覧そのものが新しい版として公開されます。</span><span>GitHub・Vercel・Supabase・mashimashi.jp の一覧は 2026-09-13 時点の内容です。</span></footer>';
  }

  // Full replacement document, rendered from the same source this page was built from.
  function pageSource(st) {
    var css = document.getElementById('css').textContent;
    var js = document.getElementById('app').textContent;
    var json = JSON.stringify(st, null, 1).replace(/</g, '\\u003c');
    var clean = { q: '', cat: 'all', kind: 'all', view: 'grouped' };
    return '<!doctype html>\n<html lang="ja">\n<head>\n' +
      '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + esc(TITLE) + '</title>\n' + FONT_LINK + '\n' +
      '<style id="css">' + css + '</style>\n</head>\n<body>\n' +
      '<div id="root" class="wrap">' + bodyHTML(st, clean) + '</div>\n' +
      '<script id="pages-data" type="application/json">' + json + '</' + 'script>\n' +
      '<script id="app">' + js + '</' + 'script>\n' +
      '</body>\n</html>\n';
  }

  /* ---------- rendering ---------- */
  function renderList() {
    document.getElementById('list').innerHTML = listHTML(state, ui);
    document.getElementById('tabs').innerHTML = tabsHTML(state, ui);
    var chips = document.getElementById('chips');
    chips.innerHTML = chipsHTML(state, ui);
    chips.hidden = !(ui.kind === 'all' || ui.kind === 'page');
    var seg = document.querySelectorAll('.seg button');
    for (var i = 0; i < seg.length; i++) seg[i].setAttribute('aria-pressed', String(seg[i].dataset.view === ui.view));
    renderSaveBar();
  }

  function renderSaveBar() {
    var bar = document.getElementById('savebar');
    var n = dirty() ? pendingCount() : 0;
    if (!n) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'savebar';
      bar.className = 'savebar';
      document.body.appendChild(bar);
    }
    bar.innerHTML = '<div class="inner"><span>未保存の変更 <span class="n">' + n + '</span> 件</span>' +
      '<button type="button" class="btn primary" id="save">保存して公開</button>' +
      '<button type="button" class="btn ghost" id="discard">取り消す</button></div>';
    document.getElementById('save').addEventListener('click', save);
    document.getElementById('discard').addEventListener('click', function () {
      state = JSON.parse(savedJSON);
      closeForm();
      renderList();
    });
  }

  var toastTimer = null;
  function toast(msg, kind) {
    var t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, kind === 'warn' ? 6000 : 3500);
  }

  /* ---------- editing ---------- */
  function setEditing(on) {
    editing = on;
    document.body.dataset.editing = on ? '1' : '';
    var btn = document.getElementById('edit-toggle');
    btn.textContent = on ? '編集を終える' : '追加・編集';
    btn.classList.toggle('primary', on);
    var panel = document.getElementById('panel');
    panel.hidden = !on;
    if (on) { openForm(null); }
  }

  function syncFormKind() {
    var kind = document.getElementById('f-kind').value;
    document.getElementById('f-cat-wrap').hidden = kind !== 'page';
    document.getElementById('f-live-wrap').hidden = kind !== 'vercel';
    var lbl = document.getElementById('f-url-label');
    lbl.textContent = kind === 'vercel' ? 'Vercel 管理画面のURL' : (kind === 'repo' ? 'GitHub のURL' : (kind === 'supabase' ? 'Supabase 管理画面のURL' : (kind === 'xserver' ? 'mashimashi.jp のURL' : 'URL')));
  }

  function openForm(p) {
    editingId = p ? p.id : null;
    var kind = p ? kindKey(p) : (ui.kind !== 'all' ? ui.kind : 'page');
    document.getElementById('panel-title').textContent = p ? '編集する' : '追加する';
    document.getElementById('form-submit').textContent = p ? '変更を反映' : '一覧に追加';
    document.getElementById('f-kind').value = kind;
    document.getElementById('f-title').value = p ? p.title : '';
    document.getElementById('f-emoji').value = p ? (p.emoji || '') : '';
    document.getElementById('f-cat').value = (p && p.cat) ? p.cat : (state.categories[0] && state.categories[0].key);
    document.getElementById('f-url').value = p ? p.url : '';
    document.getElementById('f-live').value = p ? (p.live || '') : '';
    document.getElementById('f-note').value = p ? (p.note || '') : '';
    document.getElementById('form-err').textContent = '';
    document.getElementById('panel').hidden = false;
    syncFormKind();
    if (p) document.getElementById('f-title').focus();
  }
  function closeForm() {
    editingId = null;
    if (editing) openForm(null);
  }

  function submitForm(e) {
    e.preventDefault();
    var kind = document.getElementById('f-kind').value;
    var title = document.getElementById('f-title').value.trim();
    var url = document.getElementById('f-url').value.trim();
    var live = document.getElementById('f-live').value.trim();
    var emoji = document.getElementById('f-emoji').value.trim();
    var cat = document.getElementById('f-cat').value;
    var note = document.getElementById('f-note').value.trim();
    var err = document.getElementById('form-err');
    if (!title) { err.textContent = '名前を入れてください。'; return; }
    if (!/^https?:\/\//i.test(url)) { err.textContent = 'URLは https:// から始めてください。'; return; }
    if (live && !/^https?:\/\//i.test(live)) { err.textContent = '本番URLは https:// から始めてください。'; return; }
    var dup = state.pages.filter(function (p) { return p.url === url && p.id !== editingId; })[0];
    if (dup) { err.textContent = '同じURLが「' + dup.title + '」として登録済みです。'; return; }

    function apply(p) {
      p.kind = kind; p.title = title; p.url = url; p.emoji = emoji; p.note = note;
      if (kind === 'page') p.cat = cat; else delete p.cat;
      if (kind === 'vercel' && live) p.live = live; else delete p.live;
    }
    if (editingId) {
      state.pages.forEach(function (p) { if (p.id === editingId) apply(p); });
      toast('「' + title + '」を変更しました。保存するまで公開されません。');
    } else {
      var np = { id: kind.charAt(0) + Date.now().toString(36), updated: today() };
      apply(np);
      state.pages.push(np);
      toast('「' + title + '」を一覧に追加しました。保存するまで公開されません。');
    }
    editingId = null;
    openForm(null);
    renderList();
  }

  function onListClick(e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    e.preventDefault();
    var p = state.pages.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (!p) return;
    if (b.dataset.act === 'edit') {
      openForm(p);
      document.getElementById('panel').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else if (b.dataset.act === 'del') {
      if (!window.confirm('「' + p.title + '」を一覧から外しますか？（本体は消えません）')) return;
      state.pages = state.pages.filter(function (x) { return x.id !== p.id; });
      if (editingId === p.id) closeForm();
      renderList();
    }
  }

  function save() {
    if (!artifactCap) { toast('この環境では保存できません。', 'warn'); return; }
    var btn = document.getElementById('save');
    btn.disabled = true; btn.textContent = '公開中…';
    var html = pageSource(state);
    artifactCap.publish(html).then(function () {
      // The shell reloads this view to the new version.
      toast('公開しました。読み込み直しています…');
    }).catch(function (err) {
      var code = err && err.code;
      if (code === 'conflict') {
        toast('別の場所で先に更新されました。最新版を読み込み直します。', 'warn');
        return;
      }
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required') {
        markReadOnly();
        toast('このページは閲覧専用のため保存できませんでした。', 'warn');
        return;
      }
      btn.disabled = false; btn.textContent = '保存して公開';
      if (code === 'rate_limited') toast('短時間に公開しすぎです。少し待ってからもう一度どうぞ。', 'warn');
      else if (code === 'too_large') toast('ページが大きすぎて公開できません。', 'warn');
      else toast('公開に失敗しました（' + (code || 'unknown') + '）。もう一度お試しください。', 'warn');
    });
  }

  function markReadOnly() {
    readOnly = true;
    setEditing(false);
    document.getElementById('edit-toggle').hidden = true;
    document.getElementById('readonly-note').hidden = false;
  }

  /* ---------- boot ---------- */
  root.innerHTML = bodyHTML(state, ui);

  document.getElementById('q').addEventListener('input', function (e) { ui.q = e.target.value; renderList(); });
  document.getElementById('tabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab'); if (!t) return;
    ui.kind = t.dataset.kind;
    if (ui.kind !== 'all' && ui.kind !== 'page') ui.cat = 'all';
    renderList();
  });
  document.getElementById('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    ui.cat = c.dataset.cat; renderList();
  });
  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]'); if (!b) return;
    ui.view = b.dataset.view; renderList();
  });
  document.getElementById('list').addEventListener('click', onListClick);
  document.getElementById('form').addEventListener('submit', submitForm);
  document.getElementById('f-kind').addEventListener('change', syncFormKind);
  document.getElementById('form-cancel').addEventListener('click', function () { closeForm(); });
  document.getElementById('edit-toggle').addEventListener('click', function () { setEditing(!editing); });

  // Light up editing only where this view can publish a new version of itself.
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (cap) {
      if (!cap) return;
      artifactCap = cap;
      if (!readOnly) document.getElementById('edit-toggle').hidden = false;
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
